name: Generate ESO Builds (Staggered)

on:
  schedule:
    - cron: '4 */1 * * *'  # Every hour at :04
  workflow_dispatch:
    inputs:
      trial_id:
        description: 'Trial ID to scan (leave empty for auto-detect based on time)'
        required: false
        type: number
      update_version:
        description: 'Update version to generate (e.g., u48, u49). Reads from update_config.json if empty.'
        required: false
        type: string
      deploy_only:
        description: 'Deploy committed output/ as-is (skip build pipeline). Use for frozen update deploys.'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-trial:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy-only mode notice
        if: inputs.deploy_only == true
        run: |
          echo '🚀 Deploy-only mode: deploying committed output/ directory as-is'
          echo 'Skipping build pipeline (trial detection, API calls, page generation)'

      - name: Determine which trial to run
        if: inputs.deploy_only != true
        id: trial
        run: |
          if [ -n "${{ inputs.trial_id }}" ]; then
            echo "trial_id=${{ inputs.trial_id }}" >> $GITHUB_OUTPUT
          else
            # Sequential trial scheduling: AA, HRC, SO, MoL, HoF, AS, CR, SS, KA, RG, DSR, SE, LC, OC
            # One trial per UTC hour: TRIAL_INDEX = UTC_hour % 14
            #
            # Selection depends ONLY on the hour, never the minute. GitHub's
            # scheduled cron fires with heavy jitter (often 20-50 min late) and
            # sometimes drops runs entirely. The previous 40-minute-slot scheme
            # divided by the run minute, so jitter shifted the chosen trial and
            # the last index in the cycle (OC) was starved (0 selections in 80
            # runs). Keying off the hour alone is immune to minute-level jitter:
            # a run delayed from :04 to :58 stays in the same hour -> same trial.
            #
            # 14 does not divide 24, so the index drifts one hour per day and
            # every trial gets full coverage over time. A dropped run only skips
            # that trial for one cycle and self-corrects next time.

            CURRENT_HOUR=$(date -u +%H | sed 's/^0*//' || echo "0")

            TRIAL_INDEX=$(( CURRENT_HOUR % 14 ))

            # Map trial index to actual trial IDs
            case $TRIAL_INDEX in
              0) echo "trial_id=1" >> $GITHUB_OUTPUT ;;   # AA
              1) echo "trial_id=2" >> $GITHUB_OUTPUT ;;   # HRC
              2) echo "trial_id=3" >> $GITHUB_OUTPUT ;;   # SO
              3) echo "trial_id=5" >> $GITHUB_OUTPUT ;;   # MoL
              4) echo "trial_id=6" >> $GITHUB_OUTPUT ;;   # HoF
              5) echo "trial_id=7" >> $GITHUB_OUTPUT ;;   # AS
              6) echo "trial_id=8" >> $GITHUB_OUTPUT ;;   # CR
              7) echo "trial_id=12" >> $GITHUB_OUTPUT ;;  # SS
              8) echo "trial_id=14" >> $GITHUB_OUTPUT ;;  # KA
              9) echo "trial_id=15" >> $GITHUB_OUTPUT ;;  # RG
              10) echo "trial_id=16" >> $GITHUB_OUTPUT ;;  # DSR
              11) echo "trial_id=17" >> $GITHUB_OUTPUT ;;  # SE
              12) echo "trial_id=18" >> $GITHUB_OUTPUT ;;  # LC
              13) echo "trial_id=19" >> $GITHUB_OUTPUT ;;  # OC
              *) echo "trial_id=1" >> $GITHUB_OUTPUT ;;    # Default to AA
            esac
            
            echo "Current time: $(date -u '+%Y-%m-%d %H:%M') UTC"
            echo "UTC hour: $CURRENT_HOUR"
            echo "Trial index (hour % 14): $TRIAL_INDEX"
          fi
      
      - name: Checkout main branch
        uses: actions/checkout@v4
      - name: Determine update version
        if: inputs.deploy_only != true
        id: update
        run: |
          if [ -n "${{ inputs.update_version }}" ]; then
            UPDATE_VERSION="${{ inputs.update_version }}"
          else
            # Read from update_config.json
            UPDATE_VERSION=$(python3 -c "import json; print(json.load(open('data/update_config.json'))['current_update'])")
          fi
          
          # Get the path prefix from config
          UPDATE_PREFIX=$(python3 -c "import json; c=json.load(open('data/update_config.json')); print(c.get('updates',{}).get('${UPDATE_VERSION}',{}).get('path_prefix','${UPDATE_VERSION}'))")
          UPDATE_DIR="output/${UPDATE_PREFIX}"
          
          echo "update_version=${UPDATE_VERSION}" >> $GITHUB_OUTPUT
          echo "update_prefix=${UPDATE_PREFIX}" >> $GITHUB_OUTPUT
          echo "update_dir=${UPDATE_DIR}" >> $GITHUB_OUTPUT
          echo "Using update version: ${UPDATE_VERSION}, prefix: ${UPDATE_PREFIX}, dir: ${UPDATE_DIR}"
      
      - name: Set up Python
        if: inputs.deploy_only != true
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        if: inputs.deploy_only != true
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download existing builds.json
        if: inputs.deploy_only != true
        id: download_builds
        run: |
          UPDATE_PREFIX="${{ steps.update.outputs.update_prefix }}"
          UPDATE_DIR="${{ steps.update.outputs.update_dir }}"
          mkdir -p "${UPDATE_DIR}"
          
          # Try versioned URL first, then fall back to legacy root URL
          echo "Attempting to download existing builds.json..."
          
          if curl -s --max-time 30 --retry 3 --retry-delay 5 "https://esobuild.com/${UPDATE_PREFIX}/builds.json" -o "${UPDATE_DIR}/builds.json"; then
            echo "✅ Successfully downloaded builds.json from /${UPDATE_PREFIX}/"
            echo "download_success=true" >> $GITHUB_OUTPUT
          elif curl -s --max-time 30 --retry 3 --retry-delay 5 https://esobuild.com/builds.json -o "${UPDATE_DIR}/builds.json"; then
            echo "✅ Successfully downloaded builds.json from legacy root path"
            echo "download_success=true" >> $GITHUB_OUTPUT
          else
            echo "❌ Failed to download builds.json"
            echo "download_success=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Validate downloaded builds.json
        if: inputs.deploy_only != true
        id: validate_download
        run: |
          if [ "${{ steps.download_builds.outputs.download_success }}" != "true" ]; then
            echo "⚠️ Download failed, skipping validation"
            echo "is_valid=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          if [ ! -f "${{ steps.update.outputs.update_dir }}/builds.json" ]; then
            echo "❌ builds.json file not found after download"
            echo "is_valid=false" >> $GITHUB_OUTPUT
            exit 1
          fi
          
          # Validate JSON structure and content
          python3 << 'EOF'
          import json
          import sys
          
          try:
              with open('${{ steps.update.outputs.update_dir }}/builds.json', 'r', encoding='utf-8') as f:
                  data = json.load(f)
              
              # Check structure
              if not isinstance(data, dict):
                  print('❌ Root must be a dictionary')
                  sys.exit(1)
              
              if 'trials' not in data:
                  print('❌ Missing "trials" key')
                  sys.exit(1)
              
              if not isinstance(data['trials'], dict):
                  print('❌ "trials" must be a dictionary')
                  sys.exit(1)
              
              trial_count = len(data['trials'])
              print(f'✅ JSON structure valid: {trial_count} trials found')
              
              # Check minimum trial count (require at least 3 trials for valid data)
              if trial_count < 3:
                  print(f'⚠️ Warning: Only {trial_count} trials found (minimum 3 expected)')
                  print('This may indicate data loss or incomplete download')
              
              # Log trial names for debugging
              if trial_count > 0:
                  trial_names = list(data['trials'].keys())[:10]
                  print(f'Available trials: {", ".join(trial_names)}')
              
              sys.exit(0)
          except json.JSONDecodeError as e:
              print(f'❌ Invalid JSON format: {e}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ Validation error: {e}')
              sys.exit(1)
          EOF
          
          VALIDATION_EXIT=$?
          if [ $VALIDATION_EXIT -eq 0 ]; then
            echo "is_valid=true" >> $GITHUB_OUTPUT
          else
            echo "is_valid=false" >> $GITHUB_OUTPUT
            echo "❌ Validation failed - builds.json is corrupted or invalid"
          fi
      
      - name: Attempt restore from artifacts
        if: inputs.deploy_only != true && (steps.download_builds.outputs.download_success != 'true' || steps.validate_download.outputs.is_valid != 'true')
        id: restore_artifact
        continue-on-error: true
        run: |
          echo "🔄 Attempting to restore builds.json from previous successful run..."
          
          # Try to download from the most recent successful workflow run
          RUN_ID=$(gh run list --workflow="Generate ESO Builds (Staggered)" --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')
          
          if [ -z "$RUN_ID" ] || [ "$RUN_ID" = "null" ]; then
            echo "⚠️ No previous successful run found"
            echo "restore_success=false" >> $GITHUB_OUTPUT
            exit 0
          fi
          
          echo "Found previous successful run: $RUN_ID"
          
          # Download the artifact
          gh run download $RUN_ID --name "builds-json-artifact" --dir "${{ steps.update.outputs.update_dir }}/" 2>/dev/null || {
            echo "⚠️ Failed to download artifact from run $RUN_ID"
            echo "restore_success=false" >> $GITHUB_OUTPUT
            exit 0
          }
          
          # Validate restored file
          if [ -f "${{ steps.update.outputs.update_dir }}/builds.json" ]; then
            python3 << 'EOF'
            import json
            import sys
            try:
                with open('${{ steps.update.outputs.update_dir }}/builds.json', 'r') as f:
                    data = json.load(f)
                if isinstance(data, dict) and 'trials' in data and isinstance(data['trials'], dict):
                    trial_count = len(data['trials'])
                    print(f'✅ Restored builds.json with {trial_count} trials')
                    sys.exit(0)
                else:
                    print('❌ Restored file has invalid structure')
                    sys.exit(1)
            except Exception as e:
                print(f'❌ Restored file is invalid: {e}')
                sys.exit(1)
            EOF
            
            if [ $? -eq 0 ]; then
              echo "✅ Successfully restored builds.json from artifact"
              echo "restore_success=true" >> $GITHUB_OUTPUT
            else
              echo "❌ Restored file failed validation"
              echo "restore_success=false" >> $GITHUB_OUTPUT
            fi
          else
            echo "❌ Artifact download did not produce builds.json"
            echo "restore_success=false" >> $GITHUB_OUTPUT
          fi
      
      - name: Fail if no valid builds.json
        if: inputs.deploy_only != true && steps.download_builds.outputs.download_success != 'true' && (steps.restore_artifact.outputs.restore_success != 'true' || steps.restore_artifact.outcome == 'failure')
        run: |
          echo "❌ CRITICAL: Unable to obtain valid builds.json"
          echo "  - Download from production site: ${{ steps.download_builds.outputs.download_success }}"
          echo "  - Validation: ${{ steps.validate_download.outputs.is_valid }}"
          echo "  - Restore from artifact: ${{ steps.restore_artifact.outputs.restore_success }}"
          echo ""
          echo "This workflow will FAIL to prevent deploying an empty/corrupted site."
          echo "The existing site data must be preserved."
          exit 1
      
      - name: Fail if validation failed and restore failed
        if: inputs.deploy_only != true && steps.validate_download.outputs.is_valid != 'true' && (steps.restore_artifact.outputs.restore_success != 'true' || steps.restore_artifact.outcome == 'failure')
        run: |
          echo "❌ CRITICAL: Downloaded builds.json is corrupted and restore failed"
          echo "  - Download successful but validation failed"
          echo "  - Restore from artifact: ${{ steps.restore_artifact.outputs.restore_success }}"
          echo ""
          echo "This workflow will FAIL to prevent data loss."
          exit 1
      
      - name: Create backup of builds.json
        if: inputs.deploy_only != true
        run: |
          UPDATE_DIR="${{ steps.update.outputs.update_dir }}"
          # Create a timestamped backup of builds.json BEFORE any modifications
          if [ -f "${UPDATE_DIR}/builds.json" ]; then
            timestamp=$(date -u +"%Y%m%d_%H%M%S")
            cp "${UPDATE_DIR}/builds.json" "${UPDATE_DIR}/builds_backup_${timestamp}.json"
            echo "✅ Created backup: builds_backup_${timestamp}.json"
            
            # Keep only the last 5 backups to avoid storage bloat
            ls -t "${UPDATE_DIR}"/builds_backup_*.json 2>/dev/null | tail -n +6 | xargs -r rm
          else
            echo "⚠️ No builds.json to backup (this should not happen)"
            exit 1
          fi
      
      - name: Run build analysis for trial
        if: inputs.deploy_only != true
        env:
          ESOLOGS_ID: ${{ secrets.ESOLOGS_ID }}
          ESOLOGS_SECRET: ${{ secrets.ESOLOGS_SECRET }}
          SKIP_SOCIAL_PREVIEW_GENERATION: 'true'
        run: |
          UPDATE_VERSION="${{ steps.update.outputs.update_version }}"
          UPDATE_DIR="${{ steps.update.outputs.update_dir }}"
          # Run the build analysis with update version
          CMD="python -m src.eso_build_o_rama.main --trial-id ${{ steps.trial.outputs.trial_id }} --update-version ${UPDATE_VERSION}"
          echo "Running: ${CMD}"
          if ${CMD}; then
            echo "✅ Build analysis completed successfully"
          else
            echo "❌ Build analysis failed, attempting recovery..."
            
            # Check if we have a backup to restore from
            latest_backup=$(ls -t "${UPDATE_DIR}"/builds_backup_*.json 2>/dev/null | head -1)
            if [ -n "$latest_backup" ]; then
              echo "🔄 Restoring from backup: $latest_backup"
              cp "$latest_backup" "${UPDATE_DIR}/builds.json"
              echo "✅ Restored builds.json from backup"
            else
              echo "⚠️ No backup available for recovery"
            fi
            
            # Exit with error to fail the workflow
            exit 1
          fi
      
      - name: Copy static assets to output
        if: inputs.deploy_only != true
        run: |
          UPDATE_DIR="${{ steps.update.outputs.update_dir }}"
          # Copy only icons to output (all other static assets are already in output/ from repo)
          mkdir -p "${UPDATE_DIR}/static/icons"
          cp -r static/icons/* "${UPDATE_DIR}/static/icons/"
          
          # Note: We do NOT copy static/* to output/static/ because:
          # - Social preview PNGs are pre-optimized and committed to output/static/
          # - Trial backgrounds, banners, etc. are already in output/static/ from repo
          # - The workflow generates fresh (larger) social previews in static/ but we ignore them
          # - This preserves the optimized 167KB files instead of 240KB unoptimized
      
      - name: Validate builds.json before deployment
        if: inputs.deploy_only != true
        run: |
          echo "Validating builds.json before deployment..."
          
          if [ ! -f "${{ steps.update.outputs.update_dir }}/builds.json" ]; then
            echo "❌ builds.json not found!"
            exit 1
          fi
          
          # Validate JSON structure and compare against live site
          python3 << 'EOF'
          import json
          import sys
          import urllib.request
          
          def load_json(path):
              with open(path, 'r', encoding='utf-8') as f:
                  return json.load(f)
          
          def fetch_live(url):
              try:
                  with urllib.request.urlopen(url, timeout=20) as resp:
                      if resp.status != 200:
                          return None
                      data = json.loads(resp.read().decode('utf-8'))
                      return data
              except Exception:
                  return None
          
          try:
              new_data = load_json('${{ steps.update.outputs.update_dir }}/builds.json')
              
              # Structure checks
              if not isinstance(new_data, dict) or 'trials' not in new_data or not isinstance(new_data['trials'], dict):
                  print('❌ Invalid structure in new builds.json')
                  sys.exit(1)
              
              new_count = len(new_data['trials'])
              
              # Fetch live builds.json for comparison (best-effort)
              live_data = fetch_live('https://esobuild.com/${{ steps.update.outputs.update_prefix }}/builds.json')
              if live_data and isinstance(live_data, dict) and isinstance(live_data.get('trials'), dict):
                  live_count = len(live_data['trials'])
                  print(f'ℹ️ Live trials: {live_count} | New trials: {new_count}')
                  
                  # Allow deployment if new_count >= live_count (adds trials or overwrites)
                  if new_count < live_count:
                      print(f'❌ CRITICAL: New builds.json has fewer trials ({new_count}) than live ({live_count}).')
                      print('Deployment blocked to prevent data loss. If rebuilding from scratch, push once counts are >= live.')
                      sys.exit(1)
              else:
                  # Could not fetch live; proceed if new structure is valid (workflow already validated earlier)
                  print('⚠️ Could not fetch/parse live builds.json; proceeding with structural validation only')
              
              # Log trial names for visibility
              if new_count > 0:
                  trial_names = list(new_data['trials'].keys())[:10]
                  print(f'Available trials (new): {", ".join(trial_names)}')
              
              print('✅ builds.json validation passed (relative to live)')
              sys.exit(0)
          except json.JSONDecodeError as e:
              print(f'❌ Invalid JSON: {e}')
              sys.exit(1)
          except Exception as e:
              print(f'❌ Validation error: {e}')
              sys.exit(1)
          EOF
          
          if [ $? -ne 0 ]; then
            echo "❌ builds.json validation failed - deployment aborted"
            exit 1
          fi
          
          echo "✅ builds.json validation successful"
      
      - name: Upload builds.json artifact for recovery
        if: inputs.deploy_only != true
        uses: actions/upload-artifact@v4
        with:
          name: builds-json-artifact
          path: ${{ steps.update.outputs.update_dir }}/builds.json
          retention-days: 30
      
      - name: Verify archived updates are preserved
        if: inputs.deploy_only != true
        run: |
          echo "Verifying archived update directories exist in output/..."
          python3 << 'EOF'
          import json, os, sys
          
          with open('data/update_config.json', 'r') as f:
              config = json.load(f)
          
          current = config.get('current_update', '')
          missing = []
          for key, info in config.get('updates', {}).items():
              status = info.get('status', '')
              prefix = info.get('path_prefix', key)
              # Only check archived/active updates (not pending, not the one we just generated)
              if status in ('archived', 'active') and key != current:
                  update_dir = os.path.join('output', prefix)
                  if os.path.isdir(update_dir):
                      file_count = len(os.listdir(update_dir))
                      print(f'✅ {prefix}/: {file_count} files')
                  else:
                      missing.append(prefix)
                      print(f'❌ {prefix}/: MISSING')
          
          if missing:
              print(f'\n⚠️ Missing archived updates: {missing}')
              print('These updates will not be available on the live site after deploy.')
              print('Check that output/{prefix}/ directories are committed to the repo.')
              # Warning only — don't fail the deploy for this
          else:
              print('\n✅ All archived updates are present in output/')
          EOF

      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: custom
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4