<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="ESO Meta Build Explorer redirecting to the active game update builds.">
    <meta name="robots" content="index, follow">
    <meta http-equiv="refresh" content="3;url=u49/index.html">
    <link rel="canonical" href="https://esobuild.com/u49/index.html">
    <title>ESO Meta Build Explorer | Redirecting</title>
    <style>
        :root {
            --bg: #1a1a2e;
            --panel: #16213e;
            --text: #ffffff;
            --accent: #38ef7d;
            --muted: #b9c2d0;
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            background: radial-gradient(circle at top right, #0f3460 0%, var(--bg) 60%);
            color: var(--text);
            padding: 1.5rem;
        }

        main {
            width: min(560px, 100%);
            background: rgba(22, 33, 62, 0.9);
            border: 1px solid rgba(56, 239, 125, 0.35);
            border-radius: 14px;
            padding: 1.5rem;
            box-shadow: 0 12px 36px rgba(0, 0, 0, 0.4);
        }

        h1 {
            margin: 0 0 0.5rem;
            font-size: 1.2rem;
            color: var(--accent);
        }

        p {
            margin: 0.6rem 0;
            color: var(--muted);
            line-height: 1.5;
        }

        a {
            color: var(--accent);
        }
    </style>
    <script>
        window.location.replace("u49/index.html");
    </script>
</head>
<body>
    <main>
        <h1>ESO Meta Build Explorer</h1>
        <p>Redirecting to Update 49 builds...</p>
        <p>
            If you are not redirected automatically,
            <a href="u49/index.html">continue to the active update</a>.
        </p>
        <p>
            Looking for something else?
            <a href="updates.html">View all updates</a>.
        </p>
    </main>
</body>
</html>
