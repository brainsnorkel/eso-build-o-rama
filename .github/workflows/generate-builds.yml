name: Generate ESO Builds (Staggered)

on:
  schedule:
    # Every hour, cycling through all 14 trials sequentially
    # AA at 20:00 UTC, HRC at 21:00 UTC, SO at 22:00 UTC, etc.
    # Each trial gets updated every 14 hours (14 trials × 1 hour)
    - cron: '0 * * * *'  # Every hour at :00
  workflow_dispatch:
    inputs:
      trial_id:
        description: 'Trial ID to scan (leave empty for auto-detect based on time)'
        required: false
        type: number
  push:
    branches:
      - main  # Only run on main branch pushes

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  generate-trial:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Determine which trial to run
        id: trial
        run: |
          if [ -n "${{ inputs.trial_id }}" ]; then
            echo "trial_id=${{ inputs.trial_id }}" >> $GITHUB_OUTPUT
          else
            # Sequential trial scheduling: AA, HRC, SO, MoL, HoF, AS, CR, SS, KA, RG, DSR, SE, LC, OC
            # Each trial runs every 14 hours (one trial per hour)
            # Starting reference: 20:00 UTC for AA
            
            CURRENT_HOUR=$(date -u +%H | sed 's/^0*//' || echo "0")
            
            # Hours since 20:00 UTC reference
            REFERENCE_HOUR=20
            HOURS_SINCE_REFERENCE=$(( CURRENT_HOUR - REFERENCE_HOUR ))
            
            # Handle negative values (if current time is before reference)
            if [ $HOURS_SINCE_REFERENCE -lt 0 ]; then
              HOURS_SINCE_REFERENCE=$((HOURS_SINCE_REFERENCE + 24))
            fi
            
            # Trial index = hours since reference % 14
            TRIAL_INDEX=$(( HOURS_SINCE_REFERENCE % 14 ))
            
            # Map trial index to actual trial IDs
            case $TRIAL_INDEX in
              0) echo "trial_id=1" >> $GITHUB_OUTPUT ;;   # AA
              1) echo "trial_id=2" >> $GITHUB_OUTPUT ;;   # HRC
              2) echo "trial_id=3" >> $GITHUB_OUTPUT ;;   # SO
              3) echo "trial_id=5" >> $GITHUB_OUTPUT ;;   # MoL
              4) echo "trial_id=6" >> $GITHUB_OUTPUT ;;   # HoF
              5) echo "trial_id=7" >> $GITHUB_OUTPUT ;;   # AS
              6) echo "trial_id=8" >> $GITHUB_OUTPUT ;;   # CR
              7) echo "trial_id=12" >> $GITHUB_OUTPUT ;;  # SS
              8) echo "trial_id=14" >> $GITHUB_OUTPUT ;;  # KA
              9) echo "trial_id=15" >> $GITHUB_OUTPUT ;;  # RG
              10) echo "trial_id=16" >> $GITHUB_OUTPUT ;;  # DSR
              11) echo "trial_id=17" >> $GITHUB_OUTPUT ;;  # SE
              12) echo "trial_id=18" >> $GITHUB_OUTPUT ;;  # LC
              13) echo "trial_id=19" >> $GITHUB_OUTPUT ;;  # OC
              *) echo "trial_id=1" >> $GITHUB_OUTPUT ;;    # Default to AA
            esac
            
            echo "Current time: $(date -u '+%Y-%m-%d %H:%M') UTC"
            echo "Hours since 20:00 UTC reference: $HOURS_SINCE_REFERENCE"
            echo "Trial index: $TRIAL_INDEX"
          fi
      
      - name: Checkout main branch
        uses: actions/checkout@v4
      
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: Download existing builds.json with backup
        run: |
          mkdir -p output
          
          # Try to download builds.json with retries and validation
          echo "Attempting to download existing builds.json..."
          
          # First attempt
          if curl -s --max-time 30 --retry 3 --retry-delay 5 https://esobuild.com/builds.json -o output/builds.json; then
            echo "✅ Successfully downloaded builds.json"
            
            # Validate the downloaded file
            if python3 -c "
import json
try:
    with open('output/builds.json', 'r') as f:
        data = json.load(f)
    if 'trials' in data and isinstance(data['trials'], dict):
        trial_count = len(data['trials'])
        print(f'✅ Valid builds.json with {trial_count} trials')
        exit(0)
    else:
        print('❌ Invalid builds.json structure')
        exit(1)
except Exception as e:
    print(f'❌ Invalid JSON: {e}')
    exit(1)
"; then
              echo "✅ builds.json validation passed"
            else
              echo "❌ builds.json validation failed, will use fallback"
              echo '{"trials": {}}' > output/builds.json
            fi
          else
            echo "❌ Failed to download builds.json, using fallback"
            echo '{"trials": {}}' > output/builds.json
          fi
          
          # Log the current state
          echo "Current builds.json state:"
          python3 -c "
import json
try:
    with open('output/builds.json', 'r') as f:
        data = json.load(f)
    trial_count = len(data.get('trials', {}))
    print(f'Trials in builds.json: {trial_count}')
    if trial_count > 0:
        print('Available trials:', list(data['trials'].keys())[:5])
except Exception as e:
    print(f'Error reading builds.json: {e}')
"
      
      - name: Create backup of builds.json
        run: |
          # Create a timestamped backup of builds.json
          if [ -f "output/builds.json" ]; then
            timestamp=$(date -u +"%Y%m%d_%H%M%S")
            cp output/builds.json "output/builds_backup_${timestamp}.json"
            echo "✅ Created backup: builds_backup_${timestamp}.json"
            
            # Keep only the last 5 backups to avoid storage bloat
            ls -t output/builds_backup_*.json 2>/dev/null | tail -n +6 | xargs -r rm
          else
            echo "⚠️ No builds.json to backup"
          fi
      
      - name: Run build analysis for trial
        env:
          ESOLOGS_ID: ${{ secrets.ESOLOGS_ID }}
          ESOLOGS_SECRET: ${{ secrets.ESOLOGS_SECRET }}
          SKIP_SOCIAL_PREVIEW_GENERATION: 'true'
        run: |
          # Run the build analysis
          if python -m src.eso_build_o_rama.main --trial-id ${{ steps.trial.outputs.trial_id }}; then
            echo "✅ Build analysis completed successfully"
          else
            echo "❌ Build analysis failed, attempting recovery..."
            
            # Check if we have a backup to restore from
            latest_backup=$(ls -t output/builds_backup_*.json 2>/dev/null | head -1)
            if [ -n "$latest_backup" ]; then
              echo "🔄 Restoring from backup: $latest_backup"
              cp "$latest_backup" output/builds.json
              echo "✅ Restored builds.json from backup"
            else
              echo "⚠️ No backup available for recovery"
            fi
            
            # Exit with error to fail the workflow
            exit 1
          fi
      
      - name: Copy static assets to output
        run: |
          # Copy only icons to output (all other static assets are already in output/ from repo)
          mkdir -p output/static/icons
          cp -r static/icons/* output/static/icons/
          
          # Note: We do NOT copy static/* to output/static/ because:
          # - Social preview PNGs are pre-optimized and committed to output/static/
          # - Trial backgrounds, banners, etc. are already in output/static/ from repo
          # - The workflow generates fresh (larger) social previews in static/ but we ignore them
          # - This preserves the optimized 167KB files instead of 240KB unoptimized
      
      - name: Validate builds.json before deployment
        run: |
          echo "Validating builds.json before deployment..."
          
          if [ ! -f "output/builds.json" ]; then
            echo "❌ builds.json not found!"
            exit 1
          fi
          
          # Validate JSON structure and content
          if python3 -c "
          import json
          try:
              with open('output/builds.json', 'r') as f:
                  data = json.load(f)
              
              if 'trials' not in data:
                  print('❌ Missing trials key')
                  exit(1)
              
              if not isinstance(data['trials'], dict):
                  print('❌ Trials must be a dictionary')
                  exit(1)
              
              trial_count = len(data['trials'])
              print(f'✅ builds.json validation passed: {trial_count} trials')
              
              # Log trial names for debugging
              if trial_count > 0:
                  print('Available trials:', list(data['trials'].keys())[:10])
              else:
                  print('⚠️ Warning: No trials in builds.json')
              
              exit(0)
          except json.JSONDecodeError as e:
              print(f'❌ Invalid JSON: {e}')
              exit(1)
          except Exception as e:
              print(f'❌ Validation error: {e}')
              exit(1)
          "; then
            echo "✅ builds.json validation successful"
          else
            echo "❌ builds.json validation failed!"
            exit 1
          fi
      
      - name: Setup Pages
        uses: actions/configure-pages@v4
        with:
          static_site_generator: custom
      
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output
      
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4